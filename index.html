<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2046">
<title>Air Bartoli · Keyrilès</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest?v=2026-09-23i">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-180.png?v=2026-09-23i">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png?v=2026-09-23i">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keyrilès">
<link rel="stylesheet" href="css/app.css?v=2026-09-23i">
<link rel="stylesheet" href="css/avatars.css?v=2026-09-23i">
</head>
<body>
<div class="pwa-install-banner" id="pwaBanner" hidden>
  <span class="pwa-lead">📲 Installe Keyrilès pour l’ouvrir comme une vraie application, même hors connexion.</span>
  <button class="btn btn-sm btn-primary" id="btnPwaInstall">Installer</button>
  <button class="btn btn-sm btn-ghost" id="btnPwaDismiss" aria-label="Fermer">✕</button>
</div>
<div class="boot" id="bootScreen"><div class="boot-spinner"></div></div>
<div class="app-shell" id="appShell" hidden>
  <header class="appbar">
    <div class="appbar-title">
      <span class="appbar-ico">✈</span>
      <span>Air Bartoli</span>
      <span class="appbar-sep">·</span>
      <span class="appbar-page" id="viewTitle">Saisie</span>
    </div>
    <div class="appbar-user" id="userName"></div>
  </header>
  <main class="app-main" id="appMain">
    <section class="view" data-view="saisie"></section>
    <section class="view" data-view="enfant"></section>
    <section class="view" data-view="historique"></section>
    <section class="view" data-view="dashboard"></section>
    <section class="view" data-view="reglages"></section>
  </main>
  <nav class="tabbar" id="tabBar">
    <div class="row" id="tabRow"></div>
  </nav>
  <div class="am" id="appmenu">
    <div class="am-bg" id="menuBg"></div>
    <div class="am-sheet">
      <div class="am-handle"></div>
      <div class="am-grid" id="menuGrid"></div>
      <button class="btn btn-block btn-ghost" id="btnLogout" style="margin-top:14px;color:var(--red)">Déconnexion</button>
      <button class="btn btn-block" id="menuClose" style="margin-top:8px">Fermer</button>
    </div>
  </div>
</div>
<div id="toastBox" class="toast-box"></div>
<div id="undoBox" class="undo-box"></div>
<script type="module" src="js/app.js?v=2026-09-23i"></script>
</body>
</html>
